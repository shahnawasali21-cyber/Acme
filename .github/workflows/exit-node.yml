name: Exit Node

on:
  workflow_dispatch:

permissions:
  actions: write   # lets it trigger the client workflow
  contents: read

jobs:
  exit-node:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub-hosted jobs max out at 360

    steps:
      - name: Enable IP forwarding
        run: |
          echo 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/99-tailscale.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          sudo sysctl -p /etc/sysctl.d/99-tailscale.conf

      - name: Connect Tailscale as exit node
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-exit-node
          args: --advertise-exit-node

      - name: Print IPs and trigger client workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TS_IP=$(tailscale ip -4)
          echo "=============================="
          echo "EXIT NODE TAILSCALE IP: $TS_IP"
          echo "EXIT NODE PUBLIC IP:    $(curl -s https://ifconfig.me)"
          echo "=============================="
          gh workflow run client.yml --repo "${{ github.repository }}" -f exit_node_ip="$TS_IP"

      - name: Keep exit node alive
        run: sleep 21000   # ~5h50m
