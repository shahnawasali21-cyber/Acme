name: Exit Node

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exit-node:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub-hosted jobs max out at 360

    steps:
      - name: Enable IP forwarding
        run: |
          echo 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/99-tailscale.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.d/99-tailscale.conf
          sudo sysctl -p /etc/sysctl.d/99-tailscale.conf

      # Use the SAME OAuth client as the login workflow (same value as in the Mega sheet),
      # stored here as repo secrets, so both workflows join the same tailnet.
      - name: Connect Tailscale as exit node
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: gh-exit-node
          args: --advertise-exit-node

      - name: Verify connected and print IPs
        run: |
          STATE=$(tailscale status --json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("BackendState",""))' || true)
          echo "Tailscale state: ${STATE:-unknown}"
          [ "$STATE" = "Running" ] || { echo "::error::Tailscale did not connect (state: ${STATE:-unknown}). Check TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET repo secrets."; exit 1; }
          echo "=============================="
          echo "EXIT NODE TAILSCALE IP: $(tailscale ip -4)"
          echo "EXIT NODE PUBLIC IP:    $(curl -s --max-time 20 https://ifconfig.me)"
          echo "tailnet: $(tailscale status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["MagicDNSSuffix"])')"
          echo "=============================="

      - name: Keep exit node alive
        run: sleep 21000   # ~5h50m
