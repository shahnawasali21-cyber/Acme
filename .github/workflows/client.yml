name: Client

on:
  workflow_dispatch:
    inputs:
      exit_node_ip:
        description: Tailscale IP of the exit node
        required: true

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Public IP before
        run: echo "BEFORE=$(curl -s https://ifconfig.me)" | tee -a "$GITHUB_ENV"

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-client

      - name: Route traffic through exit node
        run: |
          sudo tailscale set --exit-node=${{ inputs.exit_node_ip }} --exit-node-allow-lan-access=true
          sleep 5
          AFTER=$(curl -s --max-time 20 https://ifconfig.me)
          echo "Before: $BEFORE"
          echo "After:  $AFTER"
          [ "$BEFORE" != "$AFTER" ] && echo "✅ Traffic is going through the exit node" || echo "❌ IP did not change"

      - name: Stop using exit node
        if: always()
        run: sudo tailscale set --exit-node=
